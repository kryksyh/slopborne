# Builds dist/Slopborne-Windows.zip on a Windows runner, the same steps as packaging/windows/README.md:
# build.sh, build_dlss.sh (MSVC + NVIDIA's public DLSS SDK) and package.sh in an MSYS2 CLANG64 shell.
# The zip is uploaded as an artifact (from 0xCydral/bloodborne_pc, adapted).
name: windows-package

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022   # build_dlss.sh uses the Visual Studio 2022 generator
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A python.org-style Python for PyInstaller (package.sh) and the tests; MSYS2's own Python builds nothing here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The runner's preinstalled MSYS2 in C:\msys64, where msys2-env.sh and build_dlss.sh look for CLANG64.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          update: true
          path-type: inherit
          install: git patch unzip curl
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
            protobuf:p nlohmann-json:p openssl:p zlib:p miniupnpc:p

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install -q pytest pillow
          python -m pytest -q tests

      - name: Build
        shell: msys2 {0}
        run: bash build.sh

      - name: DLSS bridge
        shell: msys2 {0}
        run: |
          git clone -q --depth 1 https://github.com/NVIDIA/DLSS "$RUNNER_TEMP/DLSS"
          DLSS_SDK_ROOT="$RUNNER_TEMP/DLSS" bash packaging/windows/build_dlss.sh

      - name: Package
        shell: msys2 {0}
        run: |
          bash tools/fetch_fsr4_assets.sh
          WINPYTHON="$(cygpath -u "$pythonLocation")/python.exe" bash packaging/windows/package.sh
          sha256sum dist/Slopborne-Windows.zip | tee dist/Slopborne-Windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: slopborne-windows
          path: |
            dist/Slopborne-Windows.zip
            dist/Slopborne-Windows.zip.sha256
          compression-level: 0
